<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pacifica Call</title>
<style>
:root{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{--line:#e2e8e5;--soft:#f3f6f4;--muted:#607169;--accent:#147955;background:#fff;color:#17211d;user-select:none;overflow:hidden}
body[data-theme="dark"]{--line:#35423a;--soft:#24332a;--muted:#b4c1b8;--accent:#80d1aa;background:#17211b;color:#f4f7f5;color-scheme:dark}
button,input,textarea,select{font:inherit}button{cursor:pointer;white-space:nowrap;-webkit-app-region:no-drag}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:10px;padding:12px;height:100vh;border:1px solid var(--line);-webkit-app-region:drag}.grip{font-size:18px;color:var(--muted);cursor:move}.person{flex:1;min-width:0}.person b{display:block;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta,.status{margin-top:3px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b57c18;margin-right:5px}.connected .status i{background:var(--accent)}time{font-variant-numeric:tabular-nums}
.actions{display:flex;gap:5px;align-items:center;flex:none}button{height:34px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:inherit;font-size:12px;font-weight:600}.end{background:#b9303d;color:#fff;border-color:#b9303d}.icon{width:30px;padding:0;font-size:16px}button[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.wrap{height:100%;display:flex;flex-direction:column;border:1px solid var(--line)}.wrap-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);-webkit-app-region:drag}.wrap-head .person small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.wrap-body{flex:1;min-height:0;overflow:auto;padding:14px}.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.outcomes button{text-align:left;font-weight:500;height:34px}.outcomes button.selected{border-color:var(--accent);color:var(--accent);background:var(--soft)}.fields{display:grid;grid-template-columns:1fr;gap:10px}.fields label{font-size:11px;color:var(--muted);min-width:0}.fields input,.fields select,.fields textarea{display:block;width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;padding:8px;margin-top:5px;font-size:12px}.fields .notes{grid-column:1/-1}.fields textarea{resize:vertical;min-height:58px;max-height:120px;color:inherit}.wrap footer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}.wrap footer .primary{margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)}.wrap footer button{font-size:11px}.error{color:#b9303d;font-size:12px;margin:8px 0 0}
body[data-layout="vertical"] .bar{height:100vh;display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding:16px}body[data-layout="vertical"] .bar .actions{grid-column:1/-1;justify-content:center}body[data-layout="vertical"] .bar .person b{font-size:16px}body[data-layout="vertical"] .bar .meta{font-size:12px}
body[data-layout="horizontal"] .wrap-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}body[data-layout="horizontal"] .outcomes{margin:0}body[data-layout="horizontal"] .fields{align-content:start}body[data-layout="horizontal"] .fields textarea{min-height:86px}body[data-layout="horizontal"] .error{grid-column:1/-1}body[data-layout="vertical"] .wrap-head{padding:12px 10px;gap:6px}body[data-layout="vertical"] .wrap footer{padding:10px;gap:5px}body[data-layout="vertical"] .wrap footer button{padding:0 7px}
body::after{content:"";position:fixed;bottom:3px;right:3px;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.45;pointer-events:none}
</style></head><body>
<section id="call" class="bar" aria-label="Current call"><span class="grip" aria-hidden="true">⠿</span><div class="person"><b id="name">Active call</b><div id="category" class="meta"></div><div class="status"><i aria-hidden="true"></i><span id="status" role="status">Connecting…</span> <time id="timer" hidden></time></div></div><div class="actions"><button id="mute" disabled aria-pressed="false">Mute</button><button class="icon" data-action="open" aria-label="Open dialer" title="Open dialer">↗</button><button id="end" class="end" data-action="end">Cancel</button><button class="icon layout-toggle" data-action="toggle-layout" aria-label="Switch to vertical layout" title="Switch to vertical layout">▥</button><button class="icon" data-action="minimize" aria-label="Minimize call window" title="Minimize">−</button></div></section>
<section id="wrap" class="wrap" aria-label="Call result" hidden><header class="wrap-head"><span class="grip" aria-hidden="true">⠿</span><div class="person"><small id="wrap-category">CALL RESULT</small><b id="wrap-name"></b></div><button class="icon" data-action="open" aria-label="Open CRM">↗</button><button class="icon layout-toggle" data-action="toggle-layout" aria-label="Switch to vertical layout" title="Switch to vertical layout">▥</button><button class="icon" data-action="minimize" aria-label="Minimize result window">−</button></header><div class="wrap-body"><div id="outcomes" class="outcomes" aria-label="Call outcome"></div><div class="fields"><label>Follow-up<input id="followup" type="datetime-local"></label><label>Stage<select id="stage"><option>New lead</option><option>Follow-up</option><option>Appointment</option><option>Quoted</option><option>Closed</option></select></label><label class="notes">Notes<textarea id="notes" maxlength="20000" placeholder="Add a note…"></textarea></label></div><p id="error" class="error" role="alert" hidden></p></div><footer><button id="again">Call again</button><button id="pause">Pause queue</button><button id="save" class="primary">Save result</button></footer></section>
<script>
const api=window.pacificaOverlay,$=id=>document.getElementById(id);let state={},draftId='',outcome='',pending=false;
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>api.send(b.dataset.action));$('mute').onclick=()=>api.send('mute');
function choose(value){outcome=value;document.querySelectorAll('#outcomes button').forEach(b=>{const selected=b.textContent===value;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});const closed=['Not interested','Wrong number','Sold / Won'].includes(value);$('stage').value=closed?'Closed':value==='Appointment set'?'Appointment':state.wrapUp?.wasClosed?'Closed':'Follow-up';if(closed||$('stage').value==='Closed')$('followup').value=''}
function submit(kind){if(pending||!state.wrapUp)return;pending=true;['save','again','pause'].forEach(id=>$(id).disabled=true);$('error').hidden=true;api.sendWrapAction({id:state.wrapUp.id,kind,outcome,stage:$('stage').value,appointmentAt:$('followup').value,notes:$('notes').value})}
$('save').onclick=()=>submit('save');$('again').onclick=()=>submit('again');$('pause').onclick=()=>submit('pause');
api.onState(s=>{state=s;const vertical=s.layout==='vertical';document.body.dataset.layout=vertical?'vertical':'horizontal';document.querySelectorAll('.layout-toggle').forEach(b=>{const label=vertical?'Switch to horizontal layout':'Switch to vertical layout';b.title=label;b.setAttribute('aria-label',label);b.textContent=vertical?'▤':'▥'});document.body.dataset.theme=s.theme==='dark'?'dark':'light';document.body.classList.toggle('connected',!!s.connected);const wrap=!!s.wrapUp&&!s.active;$('call').hidden=wrap;$('wrap').hidden=!wrap;
 if(wrap){const w=s.wrapUp;if(draftId!==w.id){draftId=w.id;$('wrap-name').textContent=w.name||w.number;$('wrap-category').textContent=(w.category||'Call')+' · Call result';$('outcomes').replaceChildren();w.outcomes.forEach(value=>{const b=document.createElement('button');b.textContent=value;b.onclick=()=>choose(value);$('outcomes').appendChild(b)});choose(w.draft.crmOutcome);$('stage').value=w.draft.crmStage;$('followup').value=w.draft.appointmentAt||'';$('notes').value=w.draft.notes||''}
 pending=!!w.saving;$('save').disabled=pending;$('again').disabled=pending||w.doNotCall;$('pause').disabled=pending||!w.resume;$('save').textContent=w.resume?'Save & call next':'Save result';$('pause').textContent=w.resume?'Pause queue':'Queue paused';$('error').textContent=w.error||'';$('error').hidden=!w.error;return}
 draftId='';$('name').textContent=s.name||s.number||'Active call';$('name').title=[s.name,s.number].filter(Boolean).join(' · ');$('category').textContent=[s.category,s.queueRunning?'Auto queue':'Single call'].filter(Boolean).join(' · ');$('status').textContent=s.connected?'Live ·':s.statusText||'Connecting…';$('status').title=s.statusText||'';$('timer').textContent=s.elapsed||'00:00';$('timer').hidden=!s.connected;$('mute').textContent=s.muted?'Unmute':'Mute';$('mute').disabled=!s.connected;$('mute').setAttribute('aria-pressed',String(!!s.muted));$('end').textContent=s.connected?'End call':'Cancel';
});
</script></body></html>
