name: Pacifica One-Time Consolidation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pacifica-consolidate-once.yml"
      - "scripts/consolidate-pacifica-once.mjs"

permissions:
  contents: write
  actions: write

concurrency:
  group: pacifica-one-time-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Pacifica
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Bake final source and remove legacy patches
        run: node scripts/consolidate-pacifica-once.mjs

      - name: Update desktop lockfile
        working-directory: desktop
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify legacy patch system is gone
        shell: bash
        run: |
          test ! -e scripts/apply-pacifica-upgrade.mjs
          test ! -e scripts/apply-pacifica-ui-upgrade.mjs
          test ! -e scripts/apply-pacifica-platform-upgrade.mjs
          test ! -e scripts/apply-pacifica-video-finish.mjs
          test ! -e scripts/apply-pacifica-hybrid-scanner.mjs
          test ! -e scripts/apply-pacifica-ai-media-live.mjs
          test ! -e scripts/apply-pacifica-video-cleanup-v3.mjs
          ! grep -q "apply-pacifica-" package.json

      - name: Verify production build
        run: npm run build

      - name: Commit consolidated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit."
          else
            git commit -m "Consolidate Pacifica source and remove legacy patches"
            git push origin HEAD:main
          fi

      - name: Start updater-enabled desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 3
          gh workflow run pacifica-desktop-release.yml --ref main
