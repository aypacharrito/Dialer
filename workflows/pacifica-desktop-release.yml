name: Pacifica Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/pacifica-desktop-release.yml"

permissions:
  contents: write

concurrency:
  group: pacifica-desktop-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "desktop/dist" -Filter "*.exe" -File
          if ($files.Count -eq 0) {
            throw "Pacifica Windows installer was not produced."
          }
          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pacifica-desktop-${{ github.run_number }}
          name: Pacifica Desktop ${{ github.run_number }}
          make_latest: true
          generate_release_notes: false
          files: desktop/dist/*.exe
